name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install GJS and GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs gir1.2-soup-3.0 libglib2.0-dev-bin zip shellcheck
      - name: Lint
        run: npm ci --ignore-scripts --no-audit --no-fund && ./node_modules/.bin/eslint .
      - name: Lint the installer
        run: shellcheck -s sh install.sh
      - name: Validate settings schema
        run: glib-compile-schemas --strict --dry-run src/schemas
      - name: Tests (gjs, no network)
        run: make test
      - name: Build zip
        run: make zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist
      - name: Create GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
